<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
    }

    .login-container h2 {
      margin-bottom: 1.5rem;
      text-align: center;
      color: #38bdf8;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #334155;
      border-radius: 6px;
      background-color: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #38bdf8;
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background-color: #0369a1;
    }

    .signup-link {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .signup-link a {
      color: #38bdf8;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  
  <div class="login-container">
    <div id="error-box" style="display: none; background-color: #ff4d4d22; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 500;"></div>


    <h2>Welcome Back</h2>
    <form action="/login" method="POST">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" required placeholder="Enter username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">
      </div>

      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <div class="signup-link">
      Don't have an account? <a href="/signup.html">Sign Up</a>
    </div>
  </div>



  <script>
  const urlParams = new URLSearchParams(window.location.search);
  const error = urlParams.get('error');
  const errorBox = document.getElementById('error-box');

  if (error === 'notfound') {
    errorBox.textContent = '⚠️ Account not found. Please check your username or email.';
    errorBox.style.display = 'block';
  } else if (error === 'wrongpassword') {
    errorBox.textContent = '⚠️ Wrong password. Please try again.';
    errorBox.style.display = 'block';
  }
</script>

</body>
</html>
